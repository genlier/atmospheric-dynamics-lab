<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Draw initial vorticity and simulate atmospheric flow in your browser. A bilingual Fourier spectral dynamics laboratory.">
<title>Order in motion · Atmospheric Dynamics Lab</title><link rel="stylesheet" href="style.css?v=3">
<script src="data.js?v=3" defer></script><script src="i18n.js?v=3" defer></script><script src="expression.js?v=3" defer></script><script src="app.js?v=3" defer></script><script src="zip.js?v=3" defer></script><script src="live.js?v=3" defer></script>
</head><body>
<header class="topbar"><a class="brand" href="#"><span class="mark">◉</span> ATMOSPHERIC / LAB</a><div class="top-links"><a href="#live-lab" data-i18n="free">LIVE LAB</a><a href="?lang=en" lang="en">EN</a><a href="?lang=zh" lang="zh-CN">中文</a><a class="source" href="https://github.com/genlier/atmospheric-dynamics-lab" target="_blank" rel="noopener noreferrer" data-i18n="source">Source code ↗</a></div></header>
<main>
<section class="intro"><div><p class="eyebrow">A NUMERICAL FIELD NOTE / 02</p><h1 data-i18n="hero">Order in <span>motion.</span></h1><p class="lead" data-i18n="lead"></p><a href="#live-lab" class="hero-link" data-i18n="freeTitle"></a></div><div class="intro-note"><span class="status-dot"></span> <span data-i18n="intro"></span><p data-i18n="introNote"></p></div></section>
<section class="workspace" aria-label="Reference experiments">
<aside class="case-rail"><div class="rail-title"><span data-i18n="index"></span><span>09</span></div><nav id="cases" aria-label="Select an experiment"></nav><p class="rail-note" data-i18n="rail"></p></aside>
<div class="experiment">
<div class="experiment-header"><div><p class="eyebrow" id="group"></p><h2 id="case-title"></h2></div><span class="sample-tag" id="sample-count"></span></div><p class="description" id="description"></p>
<div class="metrics"><div><span data-i18n="grid"></span><strong id="grid"></strong></div><div><span data-i18n="reynolds"></span><strong id="re"></strong></div><div><span>BETA</span><strong id="beta"></strong></div><div><span>TIME STEP</span><strong id="dt"></strong></div></div>
<div class="view-controls"><label><span data-i18n="quantity"></span> <select id="field" data-i18n-aria="quantity"></select></label><label class="check"><input type="checkbox" id="fixed-scale"> <span data-i18n="fixed"></span></label></div>
<div id="recorded-animation" hidden><video id="actual-video" controls playsinline preload="metadata" aria-label="Recorded numerical animation"></video><div class="video-caption"><span id="actual-caption"></span><span><a id="download-animation" download>MP4 ↓</a> · <a id="download-png">PNG ZIP ↓</a></span></div></div>
<div class="plot-layout"><div class="field-wrap"><div class="field-caption"><span id="field-name"></span><span id="current-time"></span></div><div class="field-image"><canvas id="flow" width="640" height="640" aria-label="Reference field"></canvas><span class="axis-x">x</span><span class="axis-y" id="axis-y">y</span><div class="coordinate-note">−π <span>0</span> π</div><output id="probe"></output></div><div class="colorbar"><span id="scale-min"></span><div class="color-gradient"></div><span id="scale-max"></span></div></div><div class="diagnostics"><div class="diagnostic-title"><span>DIAGNOSTICS</span><h3 id="chart-title"></h3></div><canvas id="chart" width="580" height="350" aria-label="Reference diagnostic curves"></canvas><div id="chart-legend" class="legend"></div><p id="chart-note"></p><div class="field-stat"><div><span data-i18n="min"></span><strong id="minimum"></strong></div><div><span data-i18n="max"></span><strong id="maximum"></strong></div></div></div></div>
<div class="timeline"><button id="play" type="button" data-i18n="play"></button><div class="range-wrap"><label for="time"><span data-i18n="saved"></span> <span id="frame-index"></span></label><input type="range" id="time" min="0" max="3" value="0" step="1"><div class="time-labels" id="time-labels"></div></div><button id="reset" class="reset" type="button" data-i18n="reset"></button></div>
<p class="data-note" id="data-note"></p><button id="use-reference" class="quiet-button" type="button" data-i18n="loadReference"></button>
</div></section>
<section id="live-lab" class="live-lab" aria-label="Live simulation laboratory">
<div class="live-heading"><div><p class="eyebrow" data-i18n="free"></p><h2 data-i18n="freeTitle"></h2><p class="lead" data-i18n="freeLead"></p></div><span class="model-tag" data-i18n="model"></span></div>
<div class="live-layout">
<div class="initial-panel">
<div class="panel-label"><span data-i18n="editor"></span><span id="initial-range"></span></div>
<div class="canvas-box"><canvas id="initial-field" width="512" height="512" aria-label="Draw initial vorticity" tabindex="0"></canvas><output id="editor-probe"></output><span class="canvas-coordinates">x, y ∈ [−π, π)</span></div>
<div class="brush-tools" role="group" aria-label="Drawing tools"><button data-brush="positive" class="active" data-i18n="positive"></button><button data-brush="negative" data-i18n="negative"></button><button data-brush="erase" data-i18n="erase"></button><button id="clear-initial" data-i18n="clear"></button></div>
<div class="brush-sliders"><label><span data-i18n="brush"></span><input id="brush-width" type="range" min="0.1" max="1" step="0.05" value="0.35"></label><label><span data-i18n="strength"></span><input id="brush-strength" type="number" min="0.1" max="100" step="1" value="15"></label></div>
<div class="preset-row"><label for="preset" data-i18n="preset"></label><select id="preset"><option value="vortex" data-i18n="vortex"></option><option value="grid" data-i18n="gridPreset"></option><option value="dipole" data-i18n="dipole"></option><option value="blank" data-i18n="blank"></option></select><button id="load-preset" data-i18n="applyPreset"></button></div>
<label class="formula-label" for="initial-expression" data-i18n="formula"></label><textarea id="initial-expression" rows="3" spellcheck="false">40*exp(-((x+1)^2+y^2)/0.16)+40*exp(-((x-1)^2+y^2)/0.16)</textarea><button id="apply-expression" class="quiet-button" data-i18n="applyFormula"></button><p class="small-note" data-i18n="formulaHelp"></p>
<div class="file-tools"><label class="file-button"><span data-i18n="import"></span><input id="import-field" type="file" accept=".json,application/json"></label><button id="export-initial" data-i18n="exportInitial"></button></div>
</div>
<div class="live-result">
<div class="panel-label"><span data-i18n="result"></span><span id="live-time">t = 0</span></div>
<div class="canvas-box result-box"><canvas id="live-flow" width="640" height="640" aria-label="Computed vorticity animation"></canvas><div id="result-empty" data-i18n="empty"></div><output id="live-probe"></output></div>
<div class="colorbar live-colorbar"><span id="live-scale-min">—</span><div class="color-gradient"></div><span id="live-scale-max">—</span></div>
<div class="live-timeline"><button id="live-play" disabled data-i18n="play"></button><input id="live-timeline" aria-label="Simulation time" type="range" min="0" max="0" step="1" value="0" disabled><label><span data-i18n="speed"></span><select id="playback-speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label></div>
<div class="live-diagnostics"><div><span data-i18n="energy"></span><strong id="live-energy">—</strong></div><div><span data-i18n="enstrophy"></span><strong id="live-enstrophy">—</strong></div><div><span data-i18n="computed"></span><strong id="live-frame">—</strong></div></div>
<canvas id="live-chart" width="640" height="180" aria-label="Computed kinetic energy history"></canvas>
<div class="live-download"><label class="check"><input type="checkbox" id="live-fixed" checked> <span data-i18n="fixed"></span></label><span><button id="download-result" disabled data-i18n="download"></button> <button id="export-png" disabled>PNG ZIP ↓</button></span></div><p class="small-note" data-i18n="liveLegend"></p>
</div></div>
<form id="simulation-form" class="simulation-form">
<div class="parameter-grid"><label><span data-i18n="grid"></span><select id="sim-grid"><option value="32">32 × 32</option><option value="64" selected>64 × 64</option></select></label><label><span data-i18n="reynolds"></span><input id="sim-re" type="number" min="0.1" max="1000000" value="50" step="any" required></label><label><span data-i18n="beta"></span><input id="sim-beta" type="number" min="-100" max="100" value="0" step="any" required></label><label><span data-i18n="duration"></span><input id="sim-duration" type="number" min="0.01" max="30" value="6" step="any" required></label><label><span data-i18n="dt"></span><input id="sim-dt" type="number" min="0.00001" max="0.1" value="0.01" step="any" required></label><label><span data-i18n="frameCount"></span><select id="sim-frames"><option value="61">61</option><option value="121">121</option><option value="601" selected>601</option><option value="1201">1201</option></select></label></div>
<div class="run-row"><button id="run-simulation" type="submit" data-i18n="run"></button><button id="cancel-simulation" type="button" disabled data-i18n="cancel"></button><progress id="simulation-progress" value="0" max="1" aria-label="Simulation progress"></progress></div>
</form>
<p id="simulation-status" class="simulation-status" role="status" data-i18n="ready"></p><p class="small-note" data-i18n="localNote"></p>
</section>
<section class="principles"><div class="section-label" data-i18n="principle"></div><h2 data-i18n="principleTitle"></h2><div class="principle-grid"><article><span>01 / EXPANSION</span><h3 data-i18n="expansion"></h3><p data-i18n="expansionText"></p></article><article><span>02 / DERIVATIVE</span><h3 data-i18n="derivative"></h3><p data-i18n="derivativeText"></p></article><article><span>03 / EVOLUTION</span><h3 data-i18n="evolution"></h3><p data-i18n="evolutionText"></p></article></div></section>
</main><footer><span>ATMOSPHERIC DYNAMICS LAB</span><p data-i18n="footer"></p><a href="https://github.com/genlier/atmospheric-dynamics-lab" data-i18n="explore"></a></footer>
